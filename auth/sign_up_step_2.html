<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign In - Woorkroom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body>
    <section class="onboarding-page-2 py-5 ">
        <div class="container-fluid">
            <div class="row justify-content-between px-3 gap-4">
                <div class="col-lg-3 pt-5 pb-4 text-white sign-up-sidebar ps-md-5 ps-4">
                    <div class="logo mb-5">
                        <div class="bg-white rounded-3 p-2 d-inline-block">
                            <img src="../assets/image/auth-img/white.png" width="28" alt="logo">
                        </div>
                    </div>
                    <h3 class="mb-5 title">Get started</h3>
                    <ul class="steps list-unstyled">
                        <li class="active done">Valid your phone</li>
                        <li class="active">Tell about yourself</li>
                        <li>Tell about your company</li>
                        <li>Invite Team Members</li>
                    </ul>
                </div>
                <div class="col form-div pt-5 d-flex flex-column align-items-center">
                    <p class="step-number mb-1">STEP 2/4</p>
                    <h4 class="fw-bold mb-4 form-title">Tell about yourself</h4>
                    <form class="col-lg-5 col-md-8 col-12 mb-5">
                        <div class="mb-3">
                            <label class="form-label label">Why will you use the service?</label>
                            <select class="form-select selector">
                                <option selected>Work</option>
                                <option>Personal</option>
                                <option>Education</option>
                                <option>Freelancing</option>
                                <option>Startup</option>
                                <option>Non-Profit</option>
                                <option>Team Collaboration</option>
                                <option>Research</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label label">What describes you best?</label>
                            <select class="form-select selector">
                                <option selected>Business Owner</option>
                                <option>Freelancer</option>
                                <option>Student</option>
                                <option>Developer</option>
                                <option>Designer</option>
                                <option>Marketer</option>
                                <option>Manager</option>
                                <option>Entrepreneur</option>
                                <option>Educator</option>
                                <option>Other</option>
                            </select>
                        </div>

                        <div class="mb-3  d-flex justify-content-between">
                            <label class="form-label label">What describes you best?</label>
                            <div class="d-flex gap-3">
                                <div class="form-check">
                                    <input type="radio" class="form-check-input p-1" id="yes" name="describe" />
                                    <label class="form-check-label" for="yes">Yes</label>
                                </div>
                                <div class="form-check">
                                    <input type="radio" class="form-check-input p-1" id="no" name="describe" />
                                    <label class="form-check-label" for="no">No</label>
                                </div>
                            </div>
                        </div>
                    </form>
                    <div class="page-nasting d-flex py-4 px-md-5 w-100 justify-content-between mt-auto">
                        <a href="sign_up_step_1.html" class="btn previous-btn p-0"><i
                                class="fa-solid fa-arrow-left"></i> Previous</a>
                        <a href="sign_up_step_3.html" class="btn auth-btn d-block">
                            Next Step <i class="fa-solid fa-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

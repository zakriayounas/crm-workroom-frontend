<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign In - Woorkroom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body>
    <section class="sign-in-page py-4">
        <div class="login-container container-fluid">
            <div class="row px-3">
                <!-- Left Blue Panel -->
                <div class="left-panel col-lg-6 py-5">
                    <div>
                        <div class="mb-4 d-flex align-items-center">
                            <img src="../assets/image/auth-img/white.png" alt="Logo" class="me-3" />
                            <span class="company-name fs-3">Woorkroom</span>
                        </div>
                        <h2>Your place to work<br />Plan. Create. Control.</h2>
                        <img src="../assets/image/auth-img/Illustration.png" alt="Illustration" class="illustration" />
                    </div>
                </div>
                <!-- Right Form Panel -->
                <div class="right-panel col-lg-6 py-5">
                    <h4 class="fw-semibold mb-4 text-center">Sign In to Woorkroom</h4>
                    <form>
                        <div class="mb-3">
                            <label for="email" class="form-label label-text">Email Address</label>
                            <input type="email" class="form-control input-place input-field" id="email" placeholder="youremail@gmail.com" />
                        </div>
                        <div class="mb-3 position-relative">
                            <label for="password" class="form-label label-text">Password</label>
                            <div class="input-group input-field">
                                <input type="password" class="input-place form-control border-end-0" id="password"
                                    placeholder="••••••••" />
                                <span class="input-group-text bg-white border-start-0">
                                    <i class="fa-solid fa-eye"></i>
                                </span>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="remember" />
                                <label for="remember" class="form-check-label label">Remember me</label>
                            </div>
                            <a href="#" class="text-decoration-none forget">Forgot Password?</a>
                        </div>
                        <div class=" d-flex justify-content-center">
                            <button type="submit" class="btn auth-btn">Sign In <i class="fa-solid fa-arrow-right"></i></button>
                        </div>
                        <p class="text-center mt-4">
                            <a href="sign_up_step_1.html" class="text-decoration-none signup">Don’t have an account?</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

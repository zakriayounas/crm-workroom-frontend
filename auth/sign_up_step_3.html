<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign In - Woorkroom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body>
    <section class="onboarding-page-3 py-5">
        <div class="container-fluid">
            <div class="row justify-content-between px-3 gap-4">
                <div class="col-lg-3 pt-5 pb-4 text-white sign-up-sidebar ps-md-5 ps-4">
                    <div class="logo mb-5">
                        <div class="bg-white rounded-3 p-2 d-inline-block">
                            <img src="../assets/image/auth-img/white.png" width="28" alt="logo">
                        </div>
                    </div>
                    <h3 class="mb-5 title">Get started</h3>
                    <ul class="steps list-unstyled">
                        <li class="active done">Valid your phone</li>
                        <li class="active done">Tell about yourself</li>
                        <li class="active">Tell about your company</li>
                        <li>Invite Team Members</li>
                    </ul>
                </div>
                <div class="col form-div pt-5 d-flex flex-column align-items-center">
                    <p class="step-number mb-1">STEP 3/4</p>
                    <h4 class="fw-bold mb-4 form-title">Tell about your company</h4>
                    <form class="col-lg-5 col-md-8 col-12 mb-5">
                        <div class="mb-3 ">
                            <label class="form-label label">Your Company’s Name</label>
                            <input type="text" class="form-control input" placeholder="Company’s Name">
                        </div>

                        <div class="mb-3">
                            <label class="form-label label">Business Direction</label>
                            <select class="form-select selector">
                                <option selected>IT and Programming</option>
                                <option>Marketing and Advertising</option>
                                <option>Finance and Consulting</option>
                                <option>Health and Fitness</option>
                                <option>Education and Training</option>
                                <option>E-commerce and Retail</option>
                                <option>Design and Media</option>
                                <option>Real Estate and Property</option>
                                <option>Manufacturing and Engineering</option>
                                <option>Travel and Hospitality</option>
                                <option>NGO / Nonprofit</option>
                                <option>Other</option>
                            </select>
                        </div>

                        <div class="mb-3 select-team-size">
                            <label class="form-label label">How many people in your team?</label>
                            <div class="row g-2">
                                <div class="col-3">
                                    <input type="radio" class="btn-check" name="teamSize" id="size1" autocomplete="off"
                                        value="1">
                                    <label class="btn input w-100" for="size1">Only me</label>
                                </div>
                                <div class="col-3">
                                    <input type="radio" class="btn-check" name="teamSize" id="size2" autocomplete="off"
                                        value="2-5">
                                    <label class="btn input w-100" for="size2">2 - 5</label>
                                </div>
                                <div class="col-3">
                                    <input type="radio" class="btn-check" name="teamSize" id="size3" autocomplete="off"
                                        value="6-10">
                                    <label class="btn input w-100" for="size3">6 - 10</label>
                                </div>
                                <div class="col-3">
                                    <input type="radio" class="btn-check" name="teamSize" id="size4" autocomplete="off"
                                        value="11-20">
                                    <label class="btn input w-100" for="size4">11 - 20</label>
                                </div>

                                <div class="col-3">
                                    <input type="radio" class="btn-check" name="teamSize" id="size5" autocomplete="off"
                                        value="21-40">
                                    <label class="btn input w-100" for="size5">21 - 40</label>
                                </div>
                                <div class="col-3">
                                    <input type="radio" class="btn-check" name="teamSize" id="size6" autocomplete="off"
                                        value="41-50" checked>
                                    <label class="btn input w-100 team-size-selected" for="size6">41 -
                                        50</label>
                                </div>
                                <div class="col-3">
                                    <input type="radio" class="btn-check" name="teamSize" id="size7" autocomplete="off"
                                        value="51-100">
                                    <label class="btn input w-100" for="size7">51 - 100</label>
                                </div>
                                <div class="col-3">
                                    <input type="radio" class="btn-check" name="teamSize" id="size8" autocomplete="off"
                                        value="101-500">
                                    <label class="btn input w-100" for="size8">101 - 500</label>
                                </div>
                            </div>
                        </div>
                    </form>
                    <div class="page-nasting d-flex py-4 px-md-5 w-100 justify-content-between mt-auto">
                        <a href="sign_up_step_2.html" class="btn previous-btn p-0"><i
                                class="fa-solid fa-arrow-left"></i> Previous</a>
                        <a href="sign_up_step_4.html" class="btn auth-btn d-block">
                            Next Step <i class="fa-solid fa-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
